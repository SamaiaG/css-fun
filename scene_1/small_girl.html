<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
    <title>Girl</title>
</head>

<body>
    <div class="canvas">
    <div class="background"></div>
   <div class="girl">
        <div class="head">
            <div class="face">
                <div class="eyebrows">
                    <div class="eyebrow eb1"></div>
                    <div class="eyebrow eb2"></div>
                </div>
                <div class="eyes">
                    <div class="eye e1">
                        <div class="iris">
                            <div class="light l1"></div>
                        </div>
                    </div>
                    <div class="eye e2">
                        <div class="iris">
                            <div class="light l2"></div>
                        </div>
                    </div>
                </div>
                <div class="blushes">
                    <div class="blush b1"></div>
                    <div class="nose"></div>
                    <div class="blush b2"></div>
                </div>
                <div class="mouth"></div>
            </div>
        </div>
        <div class="neck"></div>
        <div class="hair">
            <div class="hair-front">
                <div class="front f1"></div>
                <div class="front f2"></div>
            </div>
            <div class="hair-back">
                <div class="ponytail left">
                    <span></span>
                     <span></span>
                      <span></span>
                       <span></span>
                </div>
                <div class="ponytail right">
                    <span></span>
                     <span></span>
                      <span></span>
                       <span></span>
                </div>
            </div>
        </div>
        <div class="body">
            <div class="shirt">
                <div class="shirt-neck"></div>
            </div>
        </div>
   </div>


   
    <div class="table">
        <div class="on-table">
           <div class="bear">
            <div class="bear-head">
                <div class="bear-eye eye1"></div>
                <div class="bear-eye eye2"></div>
                <div class="bear-nose">
                    <div class="bear-mouth"></div>
                </div>
            </div>
            <div class="bear-ear ear1"></div>
            <div class="bear-ear ear2"></div>
            <div class="bear-body"></div>
            <div class="bear-arms"></div>
            <div class="bear-leg leg1"></div>
            <div class="bear-leg leg2"></div>
           </div>
            <div class="laptop">
                <div class="logo">
                    <div class="bite"></div>
                </div>
            </div>
            <div class="tee">
                <div class="cup">
                    <div class="heart h1"></div>
                    <div class="heart h2"></div>
                    <div class="heart h3"></div>
                </div>
            </div>
            
        </div>
    </div>
</div>
</body>
</html>
